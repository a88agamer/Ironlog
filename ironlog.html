<!doctype html>
<html lang="fa" dir="rtl" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#080a0f">
<title>IRONLOG | مرکز تمرین</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700&display=swap">
<style>

/* ───────── Design tokens (Pulse Aurora) ───────── */
:root{
  color-scheme:dark;
  --bg:#080a0f;--surface:#0e1118;--surface-2:#141824;--surface-3:#1b2030;
  --line:rgba(255,255,255,.06);--line-2:rgba(255,255,255,.11);--hover:rgba(255,255,255,.04);
  --text:#e9ecf3;--muted:#9097ab;--faint:#6b738a;
  --accent:#7c8cff;--on-accent:#0a0c14;
  --accent-soft:color-mix(in srgb,var(--accent) 16%,transparent);
  --accent-ring:color-mix(in srgb,var(--accent) 60%,transparent);
  --good:#3dd68c;--warn:#fbbf24;--bad:#fb7185;
  --c1:var(--accent);--c2:#2dd4bf;--c3:#fbbf24;--c4:#fb7185;--c5:#a78bfa;
  --r-sm:8px;--r:12px;--r-lg:16px;--ease:cubic-bezier(.22,1,.36,1);
  --sb-w:248px;--pad:clamp(16px,2.4vw,32px);--gap:16px;--card-pad:20px;
  --shadow:0 14px 34px -18px rgba(0,0,0,.7);--pop-shadow:0 24px 60px -10px rgba(0,0,0,.75);
  --font:"Vazirmatn","Segoe UI",Tahoma,ui-sans-serif,system-ui,-apple-system,Inter,Roboto,Arial,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
html[data-theme="light"]{
  color-scheme:light;
  --bg:#f3f5fa;--surface:#ffffff;--surface-2:#f7f8fc;--surface-3:#e9edf5;
  --line:rgba(20,26,50,.08);--line-2:rgba(20,26,50,.15);--hover:rgba(20,26,50,.05);
  --text:#151a2c;--muted:#566079;--faint:#7d869c;
  --good:#12a35f;--warn:#b7791f;--bad:#d9304f;--c2:#0d9488;--c3:#b7791f;--c4:#d9304f;--c5:#7c3aed;
  --shadow:0 10px 28px -16px rgba(30,40,80,.28);--pop-shadow:0 24px 60px -12px rgba(30,40,80,.35);
}
html[data-density="compact"]{--gap:12px;--card-pad:14px;--pad:clamp(12px,1.8vw,22px)}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:var(--font);font-size:14px;line-height:1.55;color:var(--text);
  background:radial-gradient(900px 520px at 12% -8%,color-mix(in srgb,var(--accent) 13%,transparent),transparent 62%),
  radial-gradient(700px 420px at 100% 0%,rgba(45,212,191,.05),transparent 60%),var(--bg);background-attachment:fixed;-webkit-font-smoothing:antialiased}
[hidden]{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
a{color:inherit;text-decoration:none}
h1,h2,h3,p{margin:0}ul{margin:0;padding:0;list-style:none}
.num,.ltr{font-variant-numeric:tabular-nums}
.ltr{direction:ltr;unicode-bidi:isolate;text-align:start}
[dir=rtl] .ltr{text-align:right}
.muted{color:var(--muted)}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
:focus-visible{outline:2px solid var(--accent-ring);outline-offset:2px;border-radius:6px}
.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.i.sm{width:16px;height:16px}.i.xs{width:13px;height:13px}
::selection{background:var(--accent-soft)}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--surface-3);border-radius:10px;border:2px solid transparent;background-clip:padding-box}
.skip{position:fixed;inset-inline-start:12px;top:-60px;z-index:400;background:var(--accent);color:var(--on-accent);padding:8px 14px;border-radius:8px;font-weight:600;transition:top .2s}
.skip:focus{top:12px}

/* Aurora + cursor glow */
.aurora{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none}
.aurora i{position:absolute;border-radius:50%;filter:blur(90px);will-change:transform}
.aurora i:nth-child(1){width:46vmax;height:46vmax;left:-12vmax;top:-20vmax;background:var(--accent);opacity:.2;animation:drift1 26s ease-in-out infinite alternate}
.aurora i:nth-child(2){width:36vmax;height:36vmax;right:-10vmax;top:8vmax;background:var(--c2);opacity:.11;animation:drift2 32s ease-in-out infinite alternate}
.aurora i:nth-child(3){width:34vmax;height:34vmax;left:28vmax;bottom:-24vmax;background:var(--c5);opacity:.13;animation:drift3 38s ease-in-out infinite alternate}
html[data-theme="light"] .aurora i{opacity:.12!important}
@keyframes drift1{to{transform:translate(20vmax,12vmax) scale(1.25)}}
@keyframes drift2{to{transform:translate(-18vmax,16vmax) scale(.85)}}
@keyframes drift3{to{transform:translate(-16vmax,-10vmax) scale(1.2)}}
.cursor-glow{position:fixed;left:0;top:0;width:520px;height:520px;margin:-260px 0 0 -260px;border-radius:50%;z-index:-1;pointer-events:none;opacity:0;transition:opacity .5s;background:radial-gradient(circle,color-mix(in srgb,var(--accent) 18%,transparent),transparent 65%)}
.cursor-glow.on{opacity:1}

/* Intro */
#intro{position:fixed;inset:0;z-index:500;display:grid;place-items:center;cursor:pointer}
#intro .curt{position:absolute;left:0;right:0;height:50.3%;background:#06070b;transition:transform .9s cubic-bezier(.77,0,.18,1) .1s}
#intro .curt.top{top:0}#intro .curt.bot{bottom:0}
#intro.open .curt.top{transform:translateY(-101%)}#intro.open .curt.bot{transform:translateY(101%)}
.intro-core{position:relative;display:grid;justify-items:center;gap:18px;transition:opacity .35s,transform .7s var(--ease)}
#intro.open .intro-core{opacity:0;transform:scale(1.18)}
.intro-logo{width:84px;height:84px;overflow:visible;filter:drop-shadow(0 10px 30px color-mix(in srgb,var(--accent) 55%,transparent))}
.intro-logo rect{fill:var(--accent);fill-opacity:0;stroke:var(--accent);stroke-width:1.2;stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1s var(--ease) forwards,fillIn .5s .9s forwards}
.intro-logo path{fill:none;stroke:#fff;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.1s var(--ease) .25s forwards,pathDark .3s 1.1s forwards}
@keyframes fillIn{to{fill-opacity:1}}@keyframes pathDark{to{stroke:#0a0c14}}
.intro-word{font-size:12px;letter-spacing:.3em;color:#7a8196;text-transform:uppercase;animation:fade 1s .5s backwards}
.intro-bar{width:min(220px,60vw);height:2px;border-radius:2px;background:rgba(255,255,255,.12);overflow:hidden}
.intro-bar i{display:block;height:100%;background:var(--accent);box-shadow:0 0 14px var(--accent);transform-origin:left;animation:barGrow 1.3s var(--ease) forwards;transform:scaleX(0)}
@keyframes barGrow{to{transform:scaleX(1)}}

/* Shell */
.app{display:grid;grid-template-columns:var(--sb-w) minmax(0,1fr);min-height:100vh;transition:grid-template-columns .45s var(--ease)}
.app.collapsed{--sb-w:78px}
.sidebar{position:sticky;top:0;height:100vh;height:100dvh;z-index:40;display:flex;flex-direction:column;padding:16px 14px;border-inline-end:1px solid var(--line);background:linear-gradient(180deg,var(--surface),var(--bg))}
.brand{display:flex;align-items:center;gap:12px;height:44px;padding:0 6px;margin-bottom:18px}
.brand svg{width:32px;height:32px;flex:none;filter:drop-shadow(0 6px 14px color-mix(in srgb,var(--accent) 45%,transparent));transition:transform .7s var(--ease)}
.brand:hover svg{transform:rotate(-14deg) scale(1.1)}
.brand b{font-size:17px;letter-spacing:-.02em;font-weight:700}
.lbl{white-space:nowrap;overflow:hidden;max-width:170px;transition:max-width .4s var(--ease),opacity .2s}
.collapsed .lbl{max-width:0;opacity:0}
.nav-title{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--faint);padding:0 12px;margin:6px 0 8px;height:14px;white-space:nowrap;overflow:hidden;transition:opacity .2s}
.collapsed .nav-title{opacity:0}
.nav{position:relative;display:flex;flex-direction:column;gap:4px}
.nav-ind{position:absolute;inset-inline:0;top:0;height:42px;border-radius:10px;background:var(--accent-soft);border:1px solid color-mix(in srgb,var(--accent) 26%,transparent);transition:transform .5s var(--ease),height .3s;pointer-events:none}
.nav-ind::before{content:"";position:absolute;inset-inline-start:-14px;top:10px;bottom:10px;width:3px;border-radius:0 3px 3px 0;background:var(--accent);box-shadow:0 0 14px var(--accent)}
[dir=rtl] .nav-ind::before{border-radius:3px 0 0 3px}
.nav-item{position:relative;z-index:1;display:flex;align-items:center;gap:12px;height:42px;padding:0 13px;border-radius:10px;color:var(--muted);font-weight:550;transition:color .2s,background .2s;width:100%;text-align:start}
.nav-item:hover{color:var(--text);background:var(--hover)}
.nav-item .i{transition:transform .35s var(--ease),color .2s}
.nav-item:hover .i{transform:scale(1.1)}
.nav-item[aria-current="page"]{color:var(--text);background:transparent}
.nav-item[aria-current="page"] .i{color:var(--accent)}
.nav-badge{margin-inline-start:auto;font-size:11px;font-weight:700;min-width:20px;height:20px;padding:0 6px;display:grid;place-items:center;border-radius:99px;background:var(--surface-3);color:var(--text)}
.collapsed .nav-badge{position:absolute;top:7px;inset-inline-end:9px;min-width:8px;width:8px;height:8px;padding:0;font-size:0;background:var(--accent)}
.collapsed .nav-item::after{content:attr(data-label);position:absolute;inset-inline-start:calc(100% + 14px);top:50%;transform:translate(-6px,-50%);background:var(--surface-3);border:1px solid var(--line-2);padding:5px 10px;border-radius:8px;font-size:12.5px;color:var(--text);opacity:0;pointer-events:none;white-space:nowrap;transition:opacity .15s,transform .2s var(--ease);box-shadow:var(--pop-shadow)}
.collapsed .nav-item:hover::after,.collapsed .nav-item:focus-visible::after{opacity:1;transform:translate(0,-50%)}
.sb-foot{margin-top:auto;display:flex;flex-direction:column;gap:6px}
.sb-card{display:flex;align-items:center;gap:11px;padding:10px;border-radius:12px;background:var(--surface-2);border:1px solid var(--line);margin-top:6px}
.sb-card small{display:block;color:var(--muted);font-size:12px;line-height:1.2}.sb-card b{display:block;font-size:13px;line-height:1.3}
.avatar{width:34px;height:34px;border-radius:50%;flex:none;display:grid;place-items:center;font-size:12px;font-weight:700;color:var(--on-accent);background:linear-gradient(135deg,var(--accent),var(--c2))}
.side-btn{display:flex;align-items:center;gap:12px;height:38px;padding:0 13px;border-radius:10px;color:var(--muted);transition:color .2s,background .2s;width:100%;text-align:start}
.side-btn:hover{color:var(--text);background:var(--hover)}
.side-btn.danger:hover{color:var(--bad)}
#btnCollapse .i{transition:transform .45s var(--ease)}
.collapsed #btnCollapse .i{transform:rotate(180deg)}
[dir=rtl] #btnCollapse .i{transform:scaleX(-1)}[dir=rtl] .collapsed #btnCollapse .i{transform:none}
.scrim{position:fixed;inset:0;z-index:35;background:rgba(3,5,9,.62);backdrop-filter:blur(3px);opacity:0;visibility:hidden;transition:opacity .3s,visibility 0s .3s}

.shell{min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:30;height:64px;display:flex;align-items:center;gap:12px;padding:0 var(--pad);background:color-mix(in srgb,var(--bg) 74%,transparent);backdrop-filter:blur(16px) saturate(1.4);border-bottom:1px solid var(--line)}
.icon-btn{position:relative;width:38px;height:38px;display:grid;place-items:center;border-radius:10px;color:var(--muted);border:1px solid transparent;transition:color .2s,background .2s,border-color .2s,transform .2s var(--ease);flex:none}
.icon-btn:hover{color:var(--text);background:var(--surface-2);border-color:var(--line)}
.icon-btn:active{transform:scale(.92)}
#btnMenu{display:none}
.crumbs{display:flex;align-items:center;gap:8px;color:var(--faint);white-space:nowrap}.crumbs b{color:var(--text);font-weight:600}
.spacer{flex:1}
.search-wrap{position:relative;width:min(380px,100%);min-width:0}
.search{display:flex;align-items:center;gap:8px;height:38px;padding:0 10px;border-radius:10px;background:var(--surface);border:1px solid var(--line);color:var(--muted);transition:border-color .2s,box-shadow .25s,background .2s}
.search:focus-within{border-color:var(--accent-ring);box-shadow:0 0 0 4px var(--accent-soft);background:var(--surface-2);color:var(--text)}
.search input{flex:1;min-width:0;width:0;background:none;border:0;outline:none;color:var(--text)}
.search input::placeholder{color:var(--faint)}
kbd{font-family:var(--mono);font-size:11px;padding:2px 6px;border-radius:6px;background:var(--surface-3);border:1px solid var(--line-2);color:var(--muted);direction:ltr;display:inline-block}
.pop{position:absolute;inset-inline-end:0;top:calc(100% + 10px);width:min(380px,calc(100vw - 24px));background:var(--surface-2);border:1px solid var(--line-2);border-radius:14px;box-shadow:var(--pop-shadow);overflow:hidden;animation:popIn .25s var(--ease);z-index:60}
.pop.start{inset-inline-end:auto;inset-inline-start:0;width:100%;min-width:min(380px,calc(100vw - 24px))}
.pop-h{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--line)}
.pop-list{max-height:min(420px,60vh);overflow:auto}
.pop-sec{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);padding:10px 16px 4px}
.res{display:flex;align-items:center;gap:12px;width:100%;padding:9px 16px;text-align:start;transition:background .15s}
.res:hover,.res.on{background:var(--accent-soft)}
.res .t{flex:1;min-width:0}.res .t b{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.res .t small{color:var(--muted);font-size:12px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.link-btn{color:var(--accent);font-weight:600;font-size:12.5px}.link-btn:hover{text-decoration:underline}
.live{display:flex;align-items:center;gap:8px;height:34px;padding:0 12px;border-radius:99px;background:var(--surface);border:1px solid var(--line);color:var(--muted);font-size:12.5px;white-space:nowrap}
.dot-live{width:7px;height:7px;border-radius:50%;background:var(--good);animation:ping 2s infinite}
.bell-wrap{position:relative}
.bell-badge{position:absolute;top:6px;inset-inline-end:7px;width:9px;height:9px;border-radius:50%;background:var(--bad);border:2px solid var(--bg);transition:transform .3s var(--ease)}
.bell-badge.off{transform:scale(0)}
.note{display:flex;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line)}
.note:last-child{border-bottom:0}.note p{font-size:13px}.note small{color:var(--muted);font-size:12px}
.note .i{color:var(--warn);margin-top:2px}

main{padding:var(--pad);width:100%;max-width:1520px;margin:0 auto;flex:1}
.view{outline:none}
.view.entering{animation:viewIn .45s var(--ease) backwards}
.view.entering .reveal{animation:rise .7s var(--ease) backwards;animation-delay:calc(var(--i,0)*55ms + 30ms)}
.page-head{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-end;justify-content:space-between;margin-bottom:var(--gap)}
.eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);font-weight:650;margin-bottom:6px}
h1{font-size:clamp(22px,2.7vw,30px);font-weight:680;letter-spacing:-.02em;line-height:1.25}h1:focus{outline:none}
.sub{color:var(--muted);margin-top:6px;max-width:62ch}
.head-actions{display:flex;flex-wrap:wrap;gap:10px;align-items:center}

/* Primitives */
.btn{position:relative;overflow:hidden;display:inline-flex;align-items:center;justify-content:center;gap:8px;height:38px;padding:0 14px;border-radius:10px;background:var(--surface-2);border:1px solid var(--line-2);font-weight:600;font-size:13px;white-space:nowrap;transition:transform .2s var(--ease),background .2s,border-color .2s,box-shadow .25s,opacity .2s}
.btn:hover{background:var(--surface-3);transform:translateY(-1px)}.btn:active{transform:scale(.97)}
.btn[disabled]{opacity:.5;pointer-events:none}
.btn.primary{background:var(--accent);color:var(--on-accent);border-color:transparent;box-shadow:0 8px 22px -8px var(--accent)}
.btn.primary:hover{background:color-mix(in srgb,var(--accent) 86%,white)}
.btn.primary::before{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(105deg,transparent 30%,rgba(255,255,255,.45) 50%,transparent 70%);transform:translateX(-130%);transition:transform .8s var(--ease)}
.btn.primary:hover::before{transform:translateX(130%)}
.btn.danger{color:var(--bad)}.btn.danger:hover{background:color-mix(in srgb,var(--bad) 14%,var(--surface-2))}
.btn.ghost{background:transparent;border-color:transparent}.btn.ghost:hover{background:var(--hover)}
.btn.sm{height:32px;padding:0 11px;font-size:12.5px}.btn.sq{width:38px;padding:0}.btn.sm.sq{width:32px}
.rip{position:absolute;border-radius:50%;background:currentColor;pointer-events:none;animation:rip .65s ease-out forwards}
@keyframes rip{from{transform:scale(0);opacity:.28}to{transform:scale(1);opacity:0}}
.seg{position:relative;display:inline-flex;padding:3px;border-radius:11px;background:var(--surface);border:1px solid var(--line)}
.seg button{position:relative;z-index:1;height:30px;padding:0 13px;border-radius:8px;color:var(--muted);font-weight:600;font-size:12.5px;transition:color .2s;white-space:nowrap}
.seg button:hover,.seg button[aria-pressed="true"]{color:var(--text)}
.seg-thumb{position:absolute;top:3px;bottom:3px;left:0;width:0;border-radius:8px;background:var(--surface-3);border:1px solid var(--line-2);box-shadow:0 4px 12px rgba(0,0,0,.2);transition:transform .45s var(--ease),width .45s var(--ease)}
.chip{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:99px;font-size:11.5px;font-weight:650;background:var(--surface-3);color:var(--muted);white-space:nowrap}
.chip.good{color:var(--good);background:color-mix(in srgb,var(--good) 14%,transparent)}
.chip.bad{color:var(--bad);background:color-mix(in srgb,var(--bad) 14%,transparent)}
.chip.warn{color:var(--warn);background:color-mix(in srgb,var(--warn) 14%,transparent)}
.chip.acc{color:var(--accent);background:var(--accent-soft)}
.chip.t-browser{color:var(--accent);background:var(--accent-soft)}
.chip.t-local{color:var(--c2);background:color-mix(in srgb,var(--c2) 14%,transparent)}
.chip.t-app{color:var(--c3);background:color-mix(in srgb,var(--c3) 14%,transparent)}
.grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:var(--gap);margin-bottom:var(--gap)}
.s12{grid-column:span 12}.s8{grid-column:span 8}.s7{grid-column:span 7}.s5{grid-column:span 5}.s4{grid-column:span 4}.s6{grid-column:span 6}
.card{position:relative;isolation:isolate;background:linear-gradient(180deg,color-mix(in srgb,var(--surface-2) 70%,var(--surface)),var(--surface));border:1px solid var(--line);border-radius:var(--r-lg);padding:var(--card-pad);box-shadow:var(--shadow);transition:border-color .3s,transform .4s var(--ease)}
.card::before{content:"";position:absolute;inset:0;border-radius:inherit;z-index:-1;pointer-events:none;opacity:0;transition:opacity .35s;background:radial-gradient(300px circle at var(--mx,50%) var(--my,0%),color-mix(in srgb,var(--accent) 10%,transparent),transparent 70%)}
.card:hover{border-color:var(--line-2)}.card:hover::before{opacity:1}
.card-h{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.card-h h2{font-size:15px;font-weight:650}.card-h p{font-size:12.5px;color:var(--muted);margin-top:2px}

/* KPI */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:var(--gap);margin-bottom:var(--gap)}
.kpi:hover{transform:translateY(-3px)}
.kpi-top{display:flex;align-items:center;gap:10px}
.kpi-ico{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;color:var(--kc);background:color-mix(in srgb,var(--kc) 14%,transparent);transition:transform .45s var(--ease)}
.kpi:hover .kpi-ico{transform:rotate(-8deg) scale(1.1)}
.kpi-label{color:var(--muted);font-weight:550;flex:1}
.kpi-mid{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;margin-top:16px}
.kpi-val{font-size:clamp(24px,2.3vw,31px);font-weight:700;letter-spacing:-.02em;line-height:1.1}
.kpi-cap{font-size:12px;color:var(--muted);margin-top:6px}
.spark{width:104px;height:38px;color:var(--kc);overflow:visible;flex:none}
.spark path{vector-effect:non-scaling-stroke}
.spark .l{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.4s var(--ease) .15s forwards}
.spark .a{opacity:.9;animation:fade 1s .4s backwards}

/* Charts */
.chart-svg{display:block;width:100%;overflow:visible}
.chart-svg .gl{stroke:var(--line);stroke-width:1}.chart-svg .ax{fill:var(--faint);font-size:11px}
.chart-svg .ln{fill:none;stroke:var(--accent);stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.2s var(--ease) .1s forwards;filter:drop-shadow(0 6px 12px color-mix(in srgb,var(--accent) 38%,transparent))}
.chart-svg .ar{animation:fade 1s .4s backwards}
.chart-svg .hit{fill:transparent;cursor:crosshair}
.chart-svg .dot{fill:var(--surface);stroke:var(--accent);stroke-width:2.2;opacity:0;transition:opacity .15s}
.chart-svg .xh{stroke:var(--line-2);stroke-dasharray:3 4;opacity:0;transition:opacity .15s}
.chart-svg .col.hot .dot,.chart-svg .col.hot .xh{opacity:1}
#tip{position:fixed;left:0;top:0;z-index:450;pointer-events:none;padding:9px 12px;border-radius:10px;background:color-mix(in srgb,var(--surface-3) 94%,transparent);backdrop-filter:blur(10px);border:1px solid var(--line-2);box-shadow:var(--pop-shadow);opacity:0;visibility:hidden;transition:opacity .12s,visibility 0s .12s;font-size:12.5px}
#tip.on{opacity:1;visibility:visible;transition:opacity .12s}
.donut{display:flex;align-items:center;gap:22px;flex-wrap:wrap;justify-content:center}
.donut-box{position:relative;width:164px;height:164px;flex:none}
.donut-box svg{width:100%;height:100%;transform:rotate(-90deg)}
.arc{fill:none;stroke-width:15;transition:stroke-dasharray 1.1s var(--ease),opacity .25s,stroke-width .25s}
.donut-box.has-act .arc{opacity:.28}.donut-box.has-act .arc.act{opacity:1;stroke-width:20}
.donut-mid{position:absolute;inset:0;display:grid;place-content:center;text-align:center;pointer-events:none}
.donut-mid b{font-size:26px;letter-spacing:-.02em}.donut-mid span{font-size:12px;color:var(--muted)}
.dlegend{flex:1;min-width:150px;display:flex;flex-direction:column;gap:2px}
.dlegend button{display:flex;align-items:center;gap:10px;width:100%;padding:7px 10px;border-radius:9px;color:var(--muted);font-weight:550;text-align:start;transition:background .2s,color .2s}
.dlegend button i{width:9px;height:9px;border-radius:3px;flex:none}.dlegend button span{flex:1}.dlegend button b{color:var(--text)}
.dlegend button:hover,.dlegend button.act{background:var(--hover);color:var(--text)}
.rg{display:flex;flex-direction:column;gap:12px}
.rg-row{display:grid;grid-template-columns:minmax(80px,130px) 1fr 44px;gap:12px;align-items:center;cursor:pointer;border-radius:8px;padding:2px 4px;margin:0 -4px;transition:background .2s}
.rg-row:hover{background:var(--hover)}
.rg-row .n{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:8px}
.track{height:9px;border-radius:99px;background:var(--surface-3);overflow:hidden}
.fill{height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,color-mix(in srgb,var(--accent) 55%,transparent),var(--accent));transition:width 1.1s var(--ease)}
.rg-row .v{text-align:end;font-weight:650}

/* Lists / icon tiles */
.ico{width:40px;height:40px;border-radius:11px;flex:none;display:grid;place-items:center;font-size:20px;background:color-mix(in srgb,var(--ic,var(--accent)) 16%,var(--surface-3));color:var(--ic,var(--accent));overflow:hidden;font-weight:700;line-height:1}
.ico img{width:100%;height:100%;object-fit:cover}.ico.sm{width:32px;height:32px;font-size:16px;border-radius:9px}.ico.lg{width:60px;height:60px;font-size:30px;border-radius:16px}
.feed li{display:flex;align-items:center;gap:12px;padding:9px 0;border-bottom:1px solid var(--line)}
.feed li:last-child{border-bottom:0;padding-bottom:0}.feed li:first-child{padding-top:0}
.feed .t{flex:1;min-width:0}.feed .t b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.feed .t small{color:var(--muted);font-size:12.5px}
.feed .r{text-align:end;font-size:12.5px;color:var(--muted)}
.feed li.click{cursor:pointer;border-radius:10px;padding-inline:10px;margin-inline:-10px;transition:background .2s}.feed li.click:hover{background:var(--hover)}
.empty{display:grid;place-items:center;text-align:center;gap:10px;padding:40px 12px;color:var(--muted)}
.empty .i{width:34px;height:34px;color:var(--faint)}.empty b{color:var(--text)}
.quick{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:10px}
.quick button{display:flex;flex-direction:column;align-items:center;gap:8px;padding:12px 6px;border-radius:12px;border:1px solid var(--line);background:var(--surface);transition:transform .3s var(--ease),border-color .2s,background .2s;min-width:0}
.quick button:hover{transform:translateY(-3px);border-color:var(--accent-ring);background:var(--accent-soft)}
.quick span{font-size:12px;font-weight:600;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* Launchpad */
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-bottom:var(--gap)}
.chips{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.fchip{position:relative;overflow:hidden;display:inline-flex;align-items:center;gap:8px;height:32px;padding:0 12px;border-radius:99px;border:1px solid var(--line-2);font-weight:600;font-size:12.5px;color:var(--muted);background:var(--surface);transition:all .2s var(--ease)}
.fchip:hover{color:var(--text);transform:translateY(-1px)}
.fchip[aria-pressed="true"]{color:var(--on-accent);background:var(--accent);border-color:transparent}
.fchip em{font-style:normal;opacity:.7;font-size:11.5px}
.lp{display:grid;grid-template-columns:minmax(0,1fr);gap:var(--gap);align-items:start}
.lp.with-insp{grid-template-columns:minmax(0,1fr) 340px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(188px,1fr));gap:var(--gap)}
.tile{position:relative;display:flex;flex-direction:column;gap:12px;padding:16px;border-radius:var(--r-lg);background:linear-gradient(180deg,color-mix(in srgb,var(--surface-2) 70%,var(--surface)),var(--surface));border:1px solid var(--line);box-shadow:var(--shadow);cursor:pointer;text-align:start;transition:transform .35s var(--ease),border-color .25s,box-shadow .25s;outline:none}
.tile:hover,.tile:focus-visible{transform:translateY(-4px);border-color:var(--accent-ring)}
.tile.sel{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft),var(--shadow)}
.tile-top{display:flex;align-items:flex-start;justify-content:space-between}
.tile .nm{font-weight:650;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center;color:var(--muted);font-size:12px}
.tile .star{color:var(--warn)}
.tile .go{position:absolute;bottom:14px;inset-inline-end:14px;width:32px;height:32px;border-radius:10px;display:grid;place-items:center;background:var(--accent);color:var(--on-accent);opacity:0;transform:scale(.7);transition:opacity .2s,transform .3s var(--ease)}
.tile:hover .go,.tile:focus-visible .go,.tile.sel .go{opacity:1;transform:none}
.rows .tile{flex-direction:row;align-items:center;padding:10px 14px;gap:14px;border-radius:12px}
.rows .tile:hover{transform:translateX(3px)}[dir=rtl] .rows .tile:hover{transform:translateX(-3px)}
.rows{display:flex;flex-direction:column;gap:8px}
.rows .tile .body{flex:1;min-width:0}.rows .tile .go{position:static;opacity:1;transform:none;flex:none;width:30px;height:30px}
.insp{position:sticky;top:80px;max-height:calc(100vh - 100px);overflow:auto}
.insp-hero{display:flex;gap:14px;align-items:center;margin-bottom:14px}
.insp-hero b{font-size:17px;display:block;line-height:1.3}
.fld{margin:12px 0}
.fld>small{display:block;font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--faint);margin-bottom:4px}
.fld .val{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:10px;background:var(--surface);border:1px solid var(--line);font-size:13px;min-width:0}
.fld .val span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fld .val.wrap span{white-space:pre-wrap;word-break:break-word}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}

/* Forms */
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px;min-width:0}
.field>label,.field>.lab{font-size:12.5px;font-weight:600;color:var(--muted)}
.field .hint{font-size:12px;color:var(--faint)}.field .err{font-size:12px;color:var(--bad)}
.inp{width:100%;height:40px;padding:0 12px;border-radius:10px;background:var(--surface);border:1px solid var(--line-2);outline:none;transition:border-color .2s,box-shadow .2s;min-width:0}
textarea.inp{height:auto;padding:10px 12px;resize:vertical;min-height:70px}
select.inp{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 18px) 17px,calc(100% - 13px) 17px;background-size:5px 5px;background-repeat:no-repeat;padding-inline-end:32px}
[dir=rtl] select.inp{background-position:18px 17px,13px 17px}
select.inp option{background:var(--surface-2);color:var(--text)}
.inp:focus{border-color:var(--accent-ring);box-shadow:0 0 0 4px var(--accent-soft)}
.inp.bad{border-color:var(--bad)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.inline{display:flex;gap:8px;align-items:center}.inline .inp{flex:1}
.switch{position:relative;width:46px;height:26px;border-radius:99px;background:var(--surface-3);border:1px solid var(--line-2);transition:background .25s;flex:none}
.switch::after{content:"";position:absolute;top:2px;inset-inline-start:2px;width:20px;height:20px;border-radius:50%;background:var(--text);transition:transform .35s var(--ease)}
.switch[aria-checked="true"]{background:var(--accent);border-color:transparent}
.switch[aria-checked="true"]::after{transform:translateX(20px);background:var(--on-accent)}
[dir=rtl] .switch[aria-checked="true"]::after{transform:translateX(-20px)}
.set-row{display:flex;align-items:center;justify-content:space-between;gap:20px;padding:14px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.set-row:last-child{border-bottom:0;padding-bottom:0}.set-row:first-of-type{padding-top:0}
.set-row b{display:block;font-weight:600}.set-row small{color:var(--muted)}
.swatches{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.sw{width:28px;height:28px;border-radius:50%;background:var(--c);border:2px solid transparent;position:relative;transition:transform .3s var(--ease)}
.sw:hover{transform:scale(1.14)}.sw[aria-checked="true"]{border-color:var(--text);transform:scale(1.1)}
.sw[aria-checked="true"]::after{content:"";position:absolute;inset:7px;border-radius:50%;background:#fff;mix-blend-mode:difference}
input[type=color]{width:34px;height:34px;padding:0;border:1px solid var(--line-2);border-radius:50%;background:none;cursor:pointer}
.meter{height:5px;border-radius:9px;background:var(--surface-3);overflow:hidden}.meter i{display:block;height:100%;width:0;transition:width .3s,background .3s}
.emojis{display:flex;flex-wrap:wrap;gap:4px}
.emojis button{width:32px;height:32px;border-radius:8px;font-size:17px;border:1px solid transparent}.emojis button:hover{background:var(--hover)}
.emojis button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.sect{border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:14px;background:color-mix(in srgb,var(--surface) 60%,transparent)}
.sect>.lab{display:block;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);margin-bottom:12px}
.checks{max-height:260px;overflow:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.checks label{display:flex;align-items:center;gap:12px;padding:8px 12px;border-bottom:1px solid var(--line);cursor:pointer;transition:background .15s}
.checks label:last-child{border-bottom:0}.checks label:hover{background:var(--hover)}
.checks input{accent-color:var(--accent);width:16px;height:16px}

/* Workspaces */
.ws-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:var(--gap)}
.stack{display:flex;margin-top:4px}.stack .ico{margin-inline-end:-10px;border:2px solid var(--surface)}
.stack .more{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;font-size:11px;font-weight:700;background:var(--surface-3);border:2px solid var(--surface)}

/* Table */
.tbl-wrap{overflow-x:auto}
table{width:100%;min-width:640px;border-collapse:collapse}
th{font-size:12px;text-align:start;font-weight:600;color:var(--muted);padding:0 14px 10px;white-space:nowrap}
td{padding:11px 14px;border-top:1px solid var(--line);white-space:nowrap}
tbody tr{transition:background .2s}tbody tr:hover{background:var(--hover)}
tbody tr.in{animation:rowIn .5s var(--ease) backwards;animation-delay:calc(var(--k,0)*22ms)}
td.sm{max-width:320px;overflow:hidden;text-overflow:ellipsis}
.who{display:flex;align-items:center;gap:10px}

/* Modal / menu / toast / lock */
.modal-wrap{position:fixed;inset:0;z-index:200;display:grid;place-items:center;padding:16px;background:rgba(3,5,9,.62);backdrop-filter:blur(5px);animation:fade .2s}
.modal{width:min(640px,100%);max-height:calc(100vh - 32px);display:flex;flex-direction:column;background:var(--surface-2);border:1px solid var(--line-2);border-radius:18px;box-shadow:var(--pop-shadow);animation:modalIn .4s var(--ease);overflow:hidden}
.modal.sm{width:min(440px,100%)}.modal.lg{width:min(760px,100%)}
.modal-h{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 20px;border-bottom:1px solid var(--line)}
.modal-h h2{font-size:16px}.modal-b{padding:20px;overflow:auto}
.modal-f{display:flex;gap:10px;justify-content:flex-end;padding:14px 20px;border-top:1px solid var(--line);background:color-mix(in srgb,var(--surface) 60%,transparent);flex-wrap:wrap}
@keyframes modalIn{from{opacity:0;transform:translateY(18px) scale(.96)}}
.menu{position:fixed;z-index:250;min-width:200px;padding:6px;background:var(--surface-2);border:1px solid var(--line-2);border-radius:12px;box-shadow:var(--pop-shadow);animation:popIn .18s var(--ease)}
.menu button{display:flex;align-items:center;gap:10px;width:100%;padding:8px 10px;border-radius:8px;font-weight:550;font-size:13px;text-align:start;color:var(--text)}
.menu button:hover{background:var(--accent-soft)}.menu button.danger{color:var(--bad)}.menu hr{border:0;border-top:1px solid var(--line);margin:5px 0}
#toasts{position:fixed;inset-inline-end:18px;bottom:18px;z-index:480;display:flex;flex-direction:column;gap:10px;max-width:calc(100vw - 36px)}
.toast{display:flex;align-items:center;gap:10px;padding:11px 14px;border-radius:12px;background:var(--surface-3);border:1px solid var(--line-2);box-shadow:var(--pop-shadow);font-weight:550;animation:toastIn .45s var(--ease)}
.toast .i{color:var(--good)}.toast.err .i{color:var(--bad)}.toast.info .i{color:var(--accent)}
.toast button{color:var(--accent);font-weight:700;margin-inline-start:8px}
.toast.out{animation:toastOut .3s ease forwards}
#lock{position:fixed;inset:0;z-index:300;display:grid;place-items:center;padding:16px;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(22px)}
.lock-card{width:min(420px,100%);text-align:center;padding:32px 28px}
.lock-card .brand-lg{width:64px;height:64px;margin:0 auto 18px;filter:drop-shadow(0 10px 26px color-mix(in srgb,var(--accent) 50%,transparent))}
.lock-card h1{font-size:22px;margin-bottom:6px}.lock-card .field{text-align:start;margin-top:20px}
.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.codebox{font-family:var(--mono);font-size:17px;letter-spacing:.06em;text-align:center;padding:16px;border-radius:12px;background:var(--surface);border:1px dashed var(--accent);color:var(--good);direction:ltr;user-select:all;word-break:break-all}
.banner{display:flex;gap:12px;align-items:center;padding:12px 16px;border-radius:12px;background:color-mix(in srgb,var(--warn) 12%,var(--surface));border:1px solid color-mix(in srgb,var(--warn) 35%,transparent);margin-bottom:var(--gap)}
.banner.bad{background:color-mix(in srgb,var(--bad) 12%,var(--surface));border-color:color-mix(in srgb,var(--bad) 35%,transparent)}
.banner span{flex:1}
.kb{display:grid;grid-template-columns:auto 1fr;gap:8px 16px;align-items:center}

@keyframes viewIn{from{opacity:0}}
@keyframes rise{from{opacity:0;transform:translateY(16px) scale(.985)}}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes fade{from{opacity:0}}
@keyframes rowIn{from{opacity:0;transform:translateX(-10px)}}
@keyframes popIn{from{opacity:0;transform:translateY(-6px) scale(.96)}}
@keyframes toastIn{from{opacity:0;transform:translateY(20px) scale(.96)}}
@keyframes toastOut{to{opacity:0;transform:translateY(12px)}}
@keyframes ping{70%{box-shadow:0 0 0 7px transparent}0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--good) 60%,transparent)}}
h1 .w{display:inline-block;white-space:nowrap}
h1 .ch{display:inline-block;animation:chIn .8s var(--ease) backwards;animation-delay:calc(var(--c)*28ms + 120ms)}
@keyframes chIn{from{opacity:0;transform:translateY(50%) scale(.9);filter:blur(8px)}}
.eyebrow{background:linear-gradient(90deg,var(--accent),color-mix(in srgb,var(--accent) 40%,white),var(--accent));background-size:220% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 6s linear infinite}
@keyframes shine{to{background-position:-220% 0}}
::view-transition-old(root),::view-transition-new(root){animation:none;mix-blend-mode:normal}
::view-transition-old(root){z-index:1}::view-transition-new(root){z-index:2}

@media (max-width:1180px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.s8,.s7,.s5{grid-column:span 12}.s4{grid-column:span 6}.lp.with-insp{grid-template-columns:minmax(0,1fr)}.insp{position:static;max-height:none}}
@media (max-width:960px){
  .app{grid-template-columns:minmax(0,1fr)}
  .sidebar{position:fixed;inset-block:0;inset-inline-start:0;width:272px;transform:translateX(-102%);visibility:hidden;transition:transform .4s var(--ease),visibility 0s .4s;box-shadow:30px 0 80px rgba(0,0,0,.6)}
  [dir=rtl] .sidebar{transform:translateX(102%)}
  .app.nav-open .sidebar{transform:none;visibility:visible;transition-delay:0s}
  .app.nav-open .scrim{opacity:1;visibility:visible;transition:opacity .3s}
  .app.collapsed .lbl,.app.collapsed .nav-title{max-width:170px;opacity:1}
  .app.collapsed .nav-badge{position:static;min-width:20px;width:auto;height:20px;padding:0 6px;font-size:11px;background:var(--surface-3)}
  .app.collapsed .nav-item::after{display:none}#btnCollapse{display:none}#btnMenu{display:grid}.crumbs{display:none}
}
@media (max-width:720px){.s4,.s6{grid-column:span 12}.live{display:none}.search kbd{display:none}.row2{grid-template-columns:1fr}.head-actions{width:100%}.topbar{gap:8px}.spacer{display:none}.search-wrap{flex:1}}
@media (max-width:480px){.kpis{grid-template-columns:1fr}.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}.card{padding:calc(var(--card-pad) - 2px)}}
@media (hover:none){.card:hover,.kpi:hover,.tile:hover{transform:none}}
html[data-motion="reduced"] *,html[data-motion="reduced"] *::before,html[data-motion="reduced"] *::after{animation-duration:.001ms!important;animation-delay:0s!important;animation-iteration-count:1!important;transition-duration:.001ms!important;transition-delay:0s!important;scroll-behavior:auto!important}
html[data-motion="reduced"] .cursor-glow{display:none}

html[data-theme="light"] .eyebrow{background:none;-webkit-text-fill-color:currentColor;color:color-mix(in srgb,var(--accent) 72%,#000)}

/* ───────── Starter-only helpers ───────── */
.demo-note{color:var(--muted);font-size:13px}


:root{--accent:#d5ff54;--on-accent:#10140a}
html[data-theme=light]{--accent:#5b8200;--on-accent:#fff}
.sidebar{height:100dvh}.nav-item{cursor:pointer}
.side-btn{cursor:pointer}
.tst{position:fixed;bottom:84px;inset-inline-start:20px;z-index:300;background:var(--accent);color:var(--on-accent);padding:10px 16px;border-radius:10px;font-weight:700;opacity:0;transform:translateY(10px);transition:.25s;pointer-events:none}.tst.on{opacity:1;transform:none}
.pill{position:fixed;bottom:20px;inset-inline-end:20px;z-index:200;display:none;align-items:center;gap:10px;padding:10px 16px;border-radius:99px;background:var(--surface-3);border:1px solid var(--accent-ring);box-shadow:var(--pop-shadow);font-weight:700}.pill.on{display:flex}
.pill b{color:var(--accent);font-size:20px;direction:ltr}
.wk{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;margin-bottom:var(--gap)}
.wk button{display:grid;justify-items:center;gap:1px;padding:8px 2px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--muted);font-size:12.5px;font-weight:600;transition:.2s}
.wk button small{font-size:11px;color:var(--faint)}.wk button:hover{border-color:var(--line-2)}
.wk button[aria-pressed=true]{background:var(--accent-soft);border-color:var(--accent-ring);color:var(--text)}
.wk i{width:7px;height:7px;border-radius:50%;background:var(--surface-3)}.wk i.on{background:var(--accent);box-shadow:0 0 8px var(--accent)}.wk i.p{background:var(--warn)}

 else if(a==="lnav"){const p=planOf(sel);live+=+D.n;if(live>=p.ex.length){live=null;lockOff();toast("آفرین! تمرین تمام شد")}render()}
 else if(a==="bsave"){const r={k:iso(sel)};let n=0;BM.forEach(b=>{const v=en($("#bm_"+b[0]).value).replace(",",".").replace("٫",".");if(+v>0){r[b[0]]=+v;n++}});if(!n){toast("حداقل یک مقدار وارد کن");return}body=body.filter(x=>x.k!==r.k);body.push(r);store("ironlog-body",body);render();toast("اندازه‌گیری ذخیره شد")}
 else if(a==="bdel"){body=body.filter(x=>x.k!==D.d);store("ironlog-body",body);render()}
 else if(a==="csv")csv()
 else if(a==="cp"){cal=add(monthStart(cal),-1);render()}
 else if(a==="cn"){cal=add(monthStart(cal),31);render()}
 else if(a==="tm"){tstop();T.s=T.tot=+D.s;tdraw()}
 else if(a==="tgo"){T.run?tstop():tstart();render()}
 else if(a==="trs"){tstop();T.s=T.tot;render()}
 else if(a==="tstop"){tstop();render()}});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&live!==null){live=null;lockOff();render()}});
document.addEventListener("input",e=>{const t=e.target,k=iso(sel);if("sd"in t.dataset){const o=W(k);o.d=o.d||{};(o.d[t.dataset.sd]=o.d[t.dataset.sd]||{})[t.dataset.f]=t.value;save()}else if("w"in t.dataset){W(k).w=W(k).w||{};W(k).w[t.dataset.w]=t.value;save()}else if("note"in t.dataset){W(k).n=t.value;save()}});
document.addEventListener("change",e=>{const t=e.target,d=t.dataset;if("rep"in d){planOf(sel).ex[+d.rep]=[...LIB()[t.value]];savePlan();render()}else if("add"in d&&t.value){const p=planOf(sel);p.ex=p.ex||[];p.ex.push([...LIB()[t.value]]);savePlan();render()}else if("ed"in d){planOf(sel).ex[+d.ed][2]=t.value;savePlan();render()}
if("pe"in e.target.dataset){pe=e.target.value;render()}if("bm"in e.target.dataset){bm=e.target.value;render()}if("auto"in e.target.dataset){ui.auto=e.target.checked;store("ironlog-ui",ui)}});
$("#bTheme").onclick=()=>{ui.theme=ui.theme==="dark"?"light":"dark";store("ironlog-ui",ui);render()};
$("#bMot").onclick=()=>{ui.motion=!ui.motion;store("ironlog-ui",ui);render();toast(ui.motion?"موشن‌ها روشن شد":"موشن‌ها خاموش شد")};
$("#bExp").onclick=()=>{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify({app:"ironlog",v:2,log,body,plan:days})],{type:"application/json"}));a.download="ironlog-backup-"+iso(nd())+".json";a.click();URL.revokeObjectURL(a.href);toast("فایل پشتیبان آماده شد")};
$("#bImp").onclick=()=>$("#fImp").click();
$("#fImp").onchange=e=>{const f=e.target.files[0];if(!f)return;f.text().then(t=>{try{const j=JSON.parse(t);if(!j.log||typeof j.log!=="object")throw 0;if(Array.isArray(j.plan)&&j.plan.length===7){days=j.plan;savePlan()}log=j.log;if(Array.isArray(j.body)){body=j.body;store("ironlog-body",body)}save();render();toast("اطلاعات بازیابی شد")}catch(x){toast("فایل پشتیبان معتبر نیست")}});e.target.value=""};
render();requestAnimationFrame(loop);
</script>
